<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0;url=portfolio.html#education">
  <title>NISU information moved — Larck</title>
  <script>
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch {}
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="canonical" href="https://jolanclarksorillo.site/portfolio.html#education">
</head>
<body>
  <p>NISU education information is now on the <a href="portfolio.html#education">Portfolio page</a>.</p>
</body>
</html>
